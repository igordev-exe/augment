# Cloudflare Workers + D1 (plano gratuito). Passo a passo em docs/online.md.
name = "augment-api"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "augment"
# Troque pelo id que o `npx wrangler d1 create augment` mostrar.
database_id = "30a49a34-6ab0-40d8-be4c-87e56b94ef88"
migrations_dir = "migrations"

[vars]
# Vazio = aceita qualquer origem (login por token, sem cookie). Para restringir, liste as origens separadas por vírgula:
# ALLOWED_ORIGINS = "https://igordevexe.github.io,https://localhost,capacitor://localhost"
ALLOWED_ORIGINS = ""
