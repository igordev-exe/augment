name: APK Android

# Gera o APK do AUGMENT (Capacitor). A cada push no main sai um APK para baixar em Actions → este workflow →
# Artifacts. Uma tag "v1.2.3" publica o APK nas Releases do GitHub.
# Com os segredos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD, o APK
# sai assinado com a chave de release (atualiza por cima). Sem eles, sai o APK de debug (instala, mas a assinatura
# muda quando a chave de release entrar: aí é preciso desinstalar uma vez).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build web (base relativa) e cópia para o Android
        run: npm run build:android
        env:
          # Endereço do servidor online (variável do repositório). Vazio = app só offline.
          VITE_API_URL: ${{ vars.AUGMENT_API_URL }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Versão
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Chave de assinatura
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle
        working-directory: android
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/augment-${APP_VERSION}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/augment-${APP_VERSION}-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: augment-apk-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/augment-*.apk
          retention-days: 30
      - name: Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/augment-*.apk
          generate_release_notes: true
